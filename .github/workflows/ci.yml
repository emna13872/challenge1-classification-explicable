# Intégration continue de CreditLens : à chaque envoi sur GitHub, on teste tout (serveur, interface, image Docker).
# Le déploiement est fait par Render, qui reconstruit l'image Docker de la branche creditlens après chaque envoi
# (réglage conseillé : « Auto-Deploy : After CI Checks Pass », pour ne déployer que si ces tests passent).
# (Hugging Face Spaces Docker est devenu payant en juillet 2026 : abandonné.)
name: CI

on:
  push:
    branches: [creditlens]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Tests du serveur (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  frontend:
    name: Interface (construction + parcours complet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Démarrer l'API
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --port 8000 > ../uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 2; done
      - run: npx vitest run
        working-directory: frontend
      - if: failure()
        run: cat uvicorn.log

  docker:
    name: Image Docker (construction + démarrage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t creditlens .
      - name: Lancer l'image et la vérifier
        run: |
          docker run -d -p 7860:7860 --name app creditlens
          for i in $(seq 1 30); do curl -sf localhost:7860/api/health && break; sleep 2; done
          curl -sf localhost:7860/ | grep -qi "<html"
          curl -sf -X POST localhost:7860/api/data/load -H "Content-Type: application/json" \
               -d '{"dataset": "taiwan_credit"}' -o /dev/null
          echo "Image OK : interface servie, jeu de Taïwan disponible"
      - if: failure()
        run: docker logs app || true
